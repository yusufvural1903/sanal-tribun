
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sanal Tribün">

<title>Sanal Tribün Studio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont,
      "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: #000;
    color: #fff;
    margin: 0;
    padding: env(safe-area-inset-top, 14px) 14px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    max-width: 540px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px 14px;
  }

  .brand {
    font-size: 17px;
    font-weight: 800;
    color: #facc15;
    letter-spacing: -0.3px;
  }

  .pill-btn {
    background: #1c1c1e;
    color: #e5e5ea;
    border: 1px solid #2c2c2e;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .card-wrap {
    width: 100%;
    max-width: 540px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    margin-bottom: 10px;
    position: relative;
    cursor: zoom-in;
  }

  #previewImg {
    width: 100%;
    height: auto;
    display: block;
  }

  .zoom-badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }

  .panel {
    width: 100%;
    max-width: 540px;
    background: #1c1c1e;
    padding: 14px;
    border-radius: 16px;
  }

  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  label {
    font-size: 12px;
    color: #98989d;
    font-weight: 600;
  }

  .clear-text {
    background: none;
    border: none;
    color: #ff453a;
    font-size: 12px;
    font-weight: 600;
    padding: 0;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    height: 105px;
    border-radius: 12px;
    border: 1px solid #2c2c2e;
    background: #121214;
    color: #fff;
    padding: 12px;
    font-size: 16px;
    line-height: 1.35;
    resize: vertical;
    font-family: inherit;
  }

  textarea:focus {
    outline: none;
    border-color: #1d9bf0;
  }

  .slider-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 12px 0;
  }

  input[type="range"] {
    width: 100%;
    accent-color: #1d9bf0;
    margin-top: 4px;
  }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .btn {
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }

  .btn-photo {
    background: #2c2c2e;
    color: #fff;
  }

  .btn-recrop {
    background: #2c2c2e;
    color: #30d158;
    display: none;
  }

  .btn-remove {
    background: #2c2c2e;
    color: #ff453a;
    display: none;
  }

  .btn-preview {
    background: #2c2c2e;
    color: #e5e5ea;
  }

  .btn-save {
    background: #1d9bf0;
    color: #fff;
    font-size: 15px;
  }

  input[type="file"] {
    display: none;
  }

  /* FOTOĞRAF KIRPMA EKRANI */

  #cropModal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 999;
    flex-direction: column;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 16px)
      16px env(safe-area-inset-bottom, 20px);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
  }

  .crop-stage {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    background: #111;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .crop-stage img {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }

  .ratio-bar {
    display: flex;
    gap: 8px;
    margin: 12px 0;
  }

  .ratio-btn {
    flex: 1;
    padding: 10px 5px;
    background: #1c1c1e;
    color: #ccc;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .ratio-btn.active {
    background: #1d9bf0;
    color: #fff;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .btn-cancel {
    flex: 0.4;
    background: #2c2c2e;
    color: #fff;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-apply {
    flex: 1;
    background: #30d158;
    color: #000;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }

  /* TAM EKRAN ÖNİZLEME */

  #previewModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 1000;
    flex-direction: column;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 16px)
      16px env(safe-area-inset-bottom, 24px);
  }

  .preview-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 10px 0;
  }

  .preview-stage img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.8);
  }
</style>
</head>

<body>

<div class="top-bar">

  <div class="brand">SANAL TRİBÜN</div>

  <label for="logoInput" class="pill-btn">
    Logo Seç / Değiştir
  </label>

  <input type="file" id="logoInput" accept="image/*">

</div>

<div class="card-wrap" onclick="openPreviewModal()">

  <img id="previewImg" src="" alt="Önizleme">

  <div class="zoom-badge">
    Büyütmek için dokun
  </div>

</div>

<canvas id="renderCanvas" style="display:none;"></canvas>

<div class="panel">

  <div class="row-between">

    <label>Haber Metni</label>

    <button
      type="button"
      class="clear-text"
      onclick="clearText()"
    >
      Metni Temizle
    </button>

  </div>

  <textarea
    id="textInput"
    placeholder="Haber metnini buraya yapıştır..."
  ></textarea>

  <div class="slider-grid">

    <div>

      <div class="row-between">

        <label>
          Yazı: <span id="fontVal">22</span> px
        </label>

      </div>

      <input
        type="range"
        id="fontSlider"
        min="16"
        max="28"
        step="0.5"
        value="22"
      >

    </div>

    <div>

      <div class="row-between">

        <label>
          Logo Zoom: %<span id="logoZoomVal">102</span>
        </label>

      </div>

      <input
        type="range"
        id="logoZoomSlider"
        min="95"
        max="180"
        step="1"
        value="102"
      >

    </div>

  </div>

  <div class="action-grid" id="photoControls">

    <label
      for="photoInput"
      class="btn btn-photo"
      id="selectPhotoBtn"
      style="grid-column: 1 / -1;"
    >
      + Fotoğraf Ekle
    </label>

    <button
      type="button"
      class="btn btn-recrop"
      id="recropBtn"
      onclick="openCropModal()"
    >
      Yeniden Kırp
    </button>

    <button
      type="button"
      class="btn btn-remove"
      id="removeBtn"
      onclick="removePhoto()"
    >
      Fotoğrafı Sil
    </button>

    <button
      type="button"
      class="btn btn-preview"
      onclick="openPreviewModal()"
    >
      Tam Ekran Önizle
    </button>

    <button
      type="button"
      class="btn btn-save"
      onclick="exportHD()"
    >
      Kaydet / İndir
    </button>

  </div>

  <input type="file" id="photoInput" accept="image/*">

</div>

<!-- FOTOĞRAF KIRPMA EKRANI -->

<div id="cropModal">

  <div class="modal-header">

    <span class="modal-title">
      Fotoğrafı Kırp
    </span>

    <span style="font-size:12px; color:#8e8e93;">
      Yakınlaştır ve sürükle
    </span>

  </div>

  <div class="crop-stage">

    <img id="cropTarget" src="" alt="">

  </div>

  <div class="ratio-bar">

    <button
      type="button"
      class="ratio-btn active"
      onclick="setRatio(3/2, this)"
    >
      3:2
    </button>

    <button
      type="button"
      class="ratio-btn"
      onclick="setRatio(4/3, this)"
    >
      4:3
    </button>

    <button
      type="button"
      class="ratio-btn"
      onclick="setRatio(16/9, this)"
    >
      16:9
    </button>

    <button
      type="button"
      class="ratio-btn"
      onclick="setRatio(1, this)"
    >
      1:1
    </button>

    <button
      type="button"
      class="ratio-btn"
      onclick="setRatio(NaN, this)"
    >
      Serbest
    </button>

  </div>

  <div class="modal-actions">

    <button
      type="button"
      class="btn-cancel"
      onclick="closeCropModal()"
    >
      İptal
    </button>

    <button
      type="button"
      class="btn-apply"
      onclick="applyCrop()"
    >
      Kırpmayı Uygula
    </button>

  </div>

</div>

<!-- TAM EKRAN ÖNİZLEME -->

<div id="previewModal">

  <div class="modal-header">

    <span class="modal-title">
      Son Kontrol (Önizleme)
    </span>

    <span style="font-size:12px; color:#8e8e93;">
      Basılı tutup da kaydedebilirsin
    </span>

  </div>

  <div class="preview-stage">

    <img
      id="fullPreviewImg"
      src=""
      alt="Tam Ekran Önizleme"
    >

  </div>

  <div class="modal-actions">

    <button
      type="button"
      class="btn-cancel"
      onclick="closePreviewModal()"
    >
      Kapat
    </button>

    <button
      type="button"
      class="btn-save"
      style="flex:1;"
      onclick="exportHD()"
    >
      Kaydet / İndir
    </button>

  </div>

</div>

<script>

  // =========================================
  // TEMEL DEĞİŞKENLER
  // =========================================

  const canvas = document.getElementById('renderCanvas');
  const ctx = canvas.getContext('2d');

  const previewImg = document.getElementById('previewImg');
  const fullPreviewImg = document.getElementById('fullPreviewImg');

  const textInput = document.getElementById('textInput');

  const fontSlider = document.getElementById('fontSlider');
  const fontVal = document.getElementById('fontVal');

  const logoZoomSlider = document.getElementById('logoZoomSlider');
  const logoZoomVal = document.getElementById('logoZoomVal');

  let logoImg = new Image();
  let hasLogo = false;

  let rawPhotoSrc = null;
  let croppedPhotoImg = null;

  let cropper = null;

  let currentRatio = 3 / 2;

  let latestDataUrl = '';

  const DEFAULT_TEXT =
    "Shakhtar Donetsk, Stamford Bridge'de oynayacağı Şampiyonlar Ligi maçları için kombine satışı yaptı.\n\n" +
    "Bunların 20 binini Fenerbahçeli taraftarlar satın aldı. Maçta tribünler yarı yarıya olacak.\n\n" +
    "🗞️ (Akşam)";

  textInput.value = DEFAULT_TEXT;

  // =========================================
  // KAYITLI LOGO VE AYARLAR
  // =========================================

  function getStorage(key) {

    try {

      return localStorage.getItem(key);

    } catch (error) {

      return null;

    }

  }

  function setStorage(key, value) {

    try {

      localStorage.setItem(key, value);

    } catch (error) {

      console.warn('Ayar kaydedilemedi:', error);

    }

  }

  const savedZoom = getStorage('st_logo_zoom_v3');

  if (savedZoom) {

    logoZoomSlider.value = savedZoom;

    logoZoomVal.textContent = logoZoomSlider.value;

  }

  const savedLogo = getStorage('st_logo_hd');

  if (savedLogo) {

    logoImg.onload = () => {

      hasLogo = true;

      renderCard();

    };

    logoImg.src = savedLogo;

  }

  // =========================================
  // LOGO YÜKLEME
  // =========================================

  document.getElementById('logoInput')
    .addEventListener('change', e => {

      const file = e.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = ev => {

        setStorage('st_logo_hd', ev.target.result);

        const newLogo = new Image();

        newLogo.onload = () => {

          logoImg = newLogo;

          hasLogo = true;

          renderCard();

        };

        newLogo.src = ev.target.result;

      };

      reader.readAsDataURL(file);

      e.target.value = '';

    });

  // =========================================
  // METİN VE SLIDER KONTROLLERİ
  // =========================================

  textInput.addEventListener('input', renderCard);

  fontSlider.addEventListener('input', () => {

    fontVal.textContent = fontSlider.value;

    renderCard();

  });

  logoZoomSlider.addEventListener('input', () => {

    logoZoomVal.textContent = logoZoomSlider.value;

    setStorage(
      'st_logo_zoom_v3',
      logoZoomSlider.value
    );

    renderCard();

  });

  function clearText() {

    textInput.value = '';

    renderCard();

    textInput.focus();

  }

  // =========================================
  // FOTOĞRAF YÜKLEME
  // =========================================

  document.getElementById('photoInput')
    .addEventListener('change', e => {

      const file = e.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = ev => {

        rawPhotoSrc = ev.target.result;

        openCropModal();

      };

      reader.readAsDataURL(file);

      e.target.value = '';

    });

  // =========================================
  // FOTOĞRAF KIRPMA
  // =========================================

  function openCropModal() {

    if (!rawPhotoSrc) return;

    if (typeof Cropper === 'undefined') {

      alert('Fotoğraf kırpma kütüphanesi yüklenemedi.');

      return;

    }

    const modal = document.getElementById('cropModal');

    const target = document.getElementById('cropTarget');

    if (cropper) {

      cropper.destroy();

      cropper = null;

    }

    modal.style.display = 'flex';

    target.src = rawPhotoSrc;

    cropper = new Cropper(target, {

      aspectRatio: currentRatio,
      viewMode: 1,
      dragMode: 'move',
      autoCropArea: 0.95,
      guides: true,
      center: true,
      background: false,
      responsive: true

    });

  }

  function closeCropModal() {

    document.getElementById('cropModal')
      .style.display = 'none';

    if (cropper) {

      cropper.destroy();

      cropper = null;

    }

  }

  function setRatio(ratio, btn) {

    currentRatio = ratio;

    if (cropper) {

      cropper.setAspectRatio(ratio);

    }

    document.querySelectorAll('.ratio-btn')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

  }

  function applyCrop() {

    if (!cropper) return;

    const c = cropper.getCroppedCanvas({

      imageSmoothingEnabled: true,
      imageSmoothingQuality: 'high'

    });

    if (!c || !c.width || !c.height) return;

    const img = new Image();

    img.onload = () => {

      croppedPhotoImg = img;

      document.getElementById('selectPhotoBtn')
        .textContent = 'Farklı Fotoğraf Seç';

      document.getElementById('recropBtn')
        .style.display = 'block';

      document.getElementById('removeBtn')
        .style.display = 'block';

      closeCropModal();

      renderCard();

    };

    img.src = c.toDataURL('image/jpeg', 0.98);

  }

  function removePhoto() {

    croppedPhotoImg = null;

    rawPhotoSrc = null;

    document.getElementById('selectPhotoBtn')
      .textContent = '+ Fotoğraf Ekle';

    document.getElementById('recropBtn')
      .style.display = 'none';

    document.getElementById('removeBtn')
      .style.display = 'none';

    renderCard();

  }

  // =========================================
  // TAM EKRAN ÖNİZLEME
  // =========================================

  function openPreviewModal() {

    fullPreviewImg.src = latestDataUrl;

    document.getElementById('previewModal')
      .style.display = 'flex';

  }

  function closePreviewModal() {

    document.getElementById('previewModal')
      .style.display = 'none';

  }

  // =========================================
  // METNİ SATIRLARA BÖLME
  // =========================================

  function wrapText(context, text, maxWidth) {

    if (!text) return [];

    const paragraphs = text.split('\n');

    const lines = [];

    paragraphs.forEach(p => {

      if (p.trim() === '') {

        lines.push('');

        return;

      }

      const words = p.trim().split(/\s+/);

      let currentLine = '';

      for (let i = 0; i < words.length; i++) {

        const testLine = currentLine
          ? currentLine + ' ' + words[i]
          : words[i];

        const testWidth =
          context.measureText(testLine).width;

        if (testWidth > maxWidth && currentLine) {

          lines.push(currentLine);

          currentLine = words[i];

        } else {

          currentLine = testLine;

        }

      }

      lines.push(currentLine);

    });

    return lines;

  }

  // =========================================
  // YUVARLATILMIŞ DİKDÖRTGEN
  // =========================================

  function roundRect(ctx, x, y, w, h, r) {

    r = Math.min(r, w / 2, h / 2);

    ctx.beginPath();

    ctx.moveTo(x + r, y);

    ctx.arcTo(x + w, y, x + w, y + h, r);

    ctx.arcTo(x + w, y + h, x, y + h, r);

    ctx.arcTo(x, y + h, x, y, r);

    ctx.arcTo(x, y, x + w, y, r);

    ctx.closePath();

  }

  // =========================================
  // ANA GÖRSEL OLUŞTURMA MOTORU
  // =========================================

  function renderCard() {

    // ---------------------------------------
    // CANVAS VE KENAR BOŞLUKLARI
    // ---------------------------------------

    const W = 540;

    const EXPORT_WIDTH = 1170;

    const SCALE = EXPORT_WIDTH / W;

    const PAD_X = 14;

    const PAD_TOP = 12;

    const PAD_BOT = 6;

    const TEXT_W = 522;

    // Fotoğrafın sağ ve sol boşlukları eşit.
    // Sol: 14 px
    // Sağ: 14 px
    // Fotoğraf genişliği: 512 px

    const PHOTO_X = PAD_X;

    const PHOTO_W = W - (PAD_X * 2);

    const PHOTO_RADIUS = 19;

    const avatarSize = 71;

    // ---------------------------------------
    // TİPOGRAFİ AYARLARI
    // ---------------------------------------

    const FONT_FAMILY =
      '"SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';

    const fontSize = parseFloat(fontSlider.value);

    const lineHeight = fontSize * (26.5 / 22);

    const textSpacing = 0.45;

    // Karakterlerin yatay genişliği %4.8 artırıldı.
    // Dikey boyut değişmez.

    const TEXT_SCALE_X = 1.048;

    const rawText = textInput.value.trim();

    function setTextFont(size, weight, spacing = 0) {

      ctx.font =
        `${weight} ${size}px ${FONT_FAMILY}`;

      if ('letterSpacing' in ctx) {

        ctx.letterSpacing = `${spacing}px`;

      }

    }

    // ---------------------------------------
    // METİN ÖLÇÜMÜ
    // ---------------------------------------

    setTextFont(fontSize, 400, textSpacing);

    const lines = wrapText(
      ctx,
      rawText,
      TEXT_W / TEXT_SCALE_X
    );

    const firstBaseline = 114.5 + (fontSize - 22);

    let extraGap = 0;

    const positionedLines = lines.map((line, index) => {

      // Kaynak satırından önce ek boşluk

      if (
        index > 0 &&
        lines[index - 1] === '' &&
        /^\s*(🗞|📰)/u.test(line)
      ) {

        extraGap += 6;

      }

      return {

        text: line,

        y: firstBaseline +
          index * lineHeight +
          extraGap

      };

    });

    const lastBaseline = positionedLines.length

      ? positionedLines[positionedLines.length - 1].y

      : PAD_TOP + avatarSize;

    // ---------------------------------------
    // FOTOĞRAF ÖLÇÜLERİ
    // ---------------------------------------

    let photoH = 0;

    const photoTop = positionedLines.length

      ? lastBaseline + 24.5

      : PAD_TOP + avatarSize + 14;

    if (croppedPhotoImg) {

      const ratio =
        croppedPhotoImg.height /
        croppedPhotoImg.width;

      photoH = PHOTO_W * ratio;

    }

    const totalH = croppedPhotoImg

      ? photoTop + photoH + PAD_BOT

      : Math.max(

          PAD_TOP + avatarSize + PAD_BOT,

          lastBaseline + fontSize * 0.35 + PAD_BOT

        );

    // ---------------------------------------
    // CANVAS ÇÖZÜNÜRLÜĞÜ
    // ---------------------------------------

    canvas.width = Math.round(W * SCALE);

    canvas.height = Math.ceil(totalH * SCALE);

    ctx.save();

    ctx.scale(SCALE, SCALE);

    ctx.textBaseline = 'alphabetic';

    ctx.imageSmoothingEnabled = true;

    ctx.imageSmoothingQuality = 'high';

    // ---------------------------------------
    // BEYAZ ARKA PLAN
    // ---------------------------------------

    ctx.fillStyle = '#ffffff';

    ctx.fillRect(

      0,

      0,

      W,

      canvas.height / SCALE

    );

    // ---------------------------------------
    // PROFİL LOGOSU
    // ---------------------------------------

    ctx.save();

    ctx.beginPath();

    ctx.arc(

      PAD_X + avatarSize / 2,

      PAD_TOP + avatarSize / 2,

      avatarSize / 2,

      0,

      Math.PI * 2

    );

    ctx.closePath();

    ctx.clip();

    if (hasLogo) {

      const zoom =
        parseFloat(logoZoomSlider.value) / 100;

      const coverScale = Math.max(

        avatarSize / logoImg.width,

        avatarSize / logoImg.height

      ) * zoom;

      const drawW = logoImg.width * coverScale;

      const drawH = logoImg.height * coverScale;

      const drawX =
        PAD_X + (avatarSize - drawW) / 2;

      const drawY =
        PAD_TOP + (avatarSize - drawH) / 2;

      ctx.fillStyle = '#ffffff';

      ctx.fillRect(

        PAD_X,

        PAD_TOP,

        avatarSize,

        avatarSize

      );

      ctx.drawImage(

        logoImg,

        drawX,

        drawY,

        drawW,

        drawH

      );

    } else {

      ctx.fillStyle = '#facc15';

      ctx.fillRect(

        PAD_X,

        PAD_TOP,

        avatarSize,

        avatarSize

      );

    }

    ctx.restore();

    // ---------------------------------------
    // PROFİL ADI
    // ---------------------------------------

    const nameX = 97;

    const nameY = 35;

    ctx.fillStyle = '#222222';

    setTextFont(17.5, 700, 0);

    ctx.fillText(

      'Sanal Tribün',

      nameX,

      nameY

    );

    const nameWidth =
      ctx.measureText('Sanal Tribün').width;

    // ---------------------------------------
    // MAVİ TİK
    // ---------------------------------------

    const badgeX = nameX + nameWidth + 2;

    const badgeY = 18;

    const badgeSize = 20;

    ctx.save();

    ctx.translate(badgeX, badgeY);

    ctx.scale(

      badgeSize / 24,

      badgeSize / 24

    );

    ctx.fillStyle = '#1d9bf0';

    const badgePath = new Path2D(

      "M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"

    );

    ctx.fill(badgePath, 'evenodd');

    ctx.restore();

    // ---------------------------------------
    // KULLANICI ADI
    // ---------------------------------------

    ctx.fillStyle = '#657786';

    setTextFont(17, 400, 0.1);

    ctx.fillText(

      '@SanalTribun',

      nameX,

      64

    );

    // ---------------------------------------
    // SAĞ ÜST ÜÇ NOKTA
    // ---------------------------------------

    ctx.fillStyle = '#657786';

    const dotY = 35;

    [505, 511, 517].forEach(dx => {

      ctx.beginPath();

      ctx.arc(

        dx,

        dotY,

        2,

        0,

        Math.PI * 2

      );

      ctx.fill();

    });

    // ---------------------------------------
    // HABER METNİ
    // ---------------------------------------

    ctx.fillStyle = '#222222';

    setTextFont(fontSize, 400, textSpacing);

    ctx.save();

    ctx.scale(TEXT_SCALE_X, 1);

    positionedLines.forEach(line => {

      ctx.fillText(

        line.text,

        PAD_X / TEXT_SCALE_X,

        line.y

      );

    });

    ctx.restore();

    // ---------------------------------------
    // HABER FOTOĞRAFI
    // SAĞ VE SOL BOŞLUKLAR EŞİT
    // ---------------------------------------

    if (croppedPhotoImg) {

      ctx.save();

      roundRect(

        ctx,

        PHOTO_X,

        photoTop,

        PHOTO_W,

        photoH,

        PHOTO_RADIUS

      );

      ctx.clip();

      ctx.drawImage(

        croppedPhotoImg,

        PHOTO_X,

        photoTop,

        PHOTO_W,

        photoH

      );

      ctx.restore();

    }

    ctx.restore();

    // ---------------------------------------
    // YÜKSEK KALİTELİ GÖRSEL ÇIKTISI
    // ---------------------------------------

    latestDataUrl = canvas.toDataURL(

      'image/jpeg',

      0.98

    );

    previewImg.src = latestDataUrl;

    if (

      document.getElementById('previewModal')
        .style.display === 'flex'

    ) {

      fullPreviewImg.src = latestDataUrl;

    }

  }

  // =========================================
  // GÖRSELİ İNDİRME
  // =========================================

  function triggerDirectDownload(fileName) {

    const link = document.createElement('a');

    link.download = fileName;

    link.href = latestDataUrl;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

  }

  // =========================================
  // HD KAYDETME VE MOBİL PAYLAŞIM
  // =========================================

  function exportHD() {

    const fileName =
      'sanal-tribun-' + Date.now() + '.jpg';

    const isMobile =
      /iPhone|iPad|iPod|Android/i.test(
        navigator.userAgent
      );

    if (isMobile && navigator.share) {

      canvas.toBlob(async blob => {

        if (!blob) {

          triggerDirectDownload(fileName);

          return;

        }

        const file = new File(

          [blob],

          fileName,

          { type: 'image/jpeg' }

        );

        if (

          navigator.canShare &&

          navigator.canShare({ files: [file] })

        ) {

          try {

            await navigator.share({

              files: [file]

            });

            return;

          } catch (err) {

            if (err.name === 'AbortError') return;

          }

        }

        triggerDirectDownload(fileName);

      }, 'image/jpeg', 0.98);

    } else {

      triggerDirectDownload(fileName);

    }

  }

  // =========================================
  // İLK AÇILIŞ
  // =========================================

  renderCard();

  if (document.fonts && document.fonts.ready) {

    document.fonts.ready.then(() => {

      renderCard();

    });

  }

</script>
